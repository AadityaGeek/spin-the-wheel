<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Spin the Wheel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-3 sm:p-6 lg:p-8">
    <!-- Main App Container Card -->
    <main
      class="max-w-5xl w-full bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-5 sm:p-7 md:p-8 flex flex-col lg:flex-row gap-6 md:gap-8 items-center lg:items-start justify-between"
    >
      <!-- Left Panel: Controls & Options Management -->
      <section class="w-full lg:w-[390px] xl:w-[420px] flex flex-col gap-5 flex-shrink-0">
        <!-- Header -->
        <header class="flex items-center justify-between w-full">
          <div class="flex flex-col gap-1">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-200 flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10" />
                  <circle cx="12" cy="12" r="6" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
              </div>
              <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
                Spin the Wheel!
              </h1>
            </div>
            <p class="text-xs sm:text-sm text-slate-500 font-medium">
              Customize options, adjust weights, and test your luck.
            </p>
          </div>
          <!-- Sound Toggle Button -->
          <button
            id="soundToggleBtn"
            aria-label="Toggle Sound"
            title="Toggle Sound Effects"
            class="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 hover:text-indigo-600 transition-all shadow-xs flex-shrink-0"
          >
            <svg id="soundOnIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
            <svg id="soundOffIcon" class="w-5 h-5 hidden text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>
          </button>
        </header>

        <!-- Collapsible Options Manager -->
        <details
          id="optionsDetails"
          class="w-full collapsible-section rounded-2xl border border-slate-200/90 overflow-hidden bg-white shadow-sm"
        >
          <summary
            class="p-3.5 bg-slate-50 hover:bg-slate-100/80 text-slate-800 font-semibold text-sm flex items-center justify-between cursor-pointer select-none transition-colors border-b border-slate-200/70"
          >
            <div class="flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
              </svg>
              <span>Manage Options</span>
            </div>
            <div class="flex items-center gap-2">
              <span
                id="optionsCountBadge"
                class="text-xs bg-indigo-50 text-indigo-700 border border-indigo-100 px-2 py-0.5 rounded-full font-bold"
              >
                5/16
              </span>
              <svg
                class="summary-chevron h-4 w-4 text-slate-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </summary>

          <div class="p-4 bg-slate-50/50 flex flex-col gap-4">
            <!-- Quick Presets Selector -->
            <div class="flex items-center justify-between text-xs font-semibold text-slate-500">
              <span class="flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                <span>Templates</span>
              </span>
              <select
                id="presetSelect"
                class="text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-slate-700 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer shadow-xs"
              >
                <option value="" disabled selected>Load preset...</option>
                <option value="raffle">Classic Raffle</option>
                <option value="yesno">Yes / No / Maybe</option>
                <option value="dice">Dice Roll (1 to 6)</option>
                <option value="dinner">Dinner Decider</option>
                <option value="team">Team Pick (4 Members)</option>
              </select>
            </div>

            <!-- Add Option Input Group -->
            <div class="flex flex-col gap-1.5">
              <label for="optionInput" class="text-xs font-bold text-slate-600 uppercase tracking-wider">
                Add New Option
              </label>
              <div class="flex gap-2">
                <input
                  type="text"
                  id="optionInput"
                  placeholder="e.g. Free Pizza, Big Prize"
                  maxlength="32"
                  class="flex-1 min-w-0 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-sm"
                />
                <button
                  id="addOptionBtn"
                  class="px-4 py-2.5 rounded-xl text-white font-semibold text-sm button-gradient shadow-sm hover:shadow transition-all flex items-center justify-center gap-1.5 flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                  </svg>
                  <span>Add</span>
                </button>
              </div>
            </div>

            <!-- Current Options List -->
            <div class="flex flex-col gap-2">
              <div class="flex items-center justify-between text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <span class="flex items-center gap-1.5">
                  <span>Current Slices</span>
                  <span id="totalWeightLabel" class="text-slate-400 font-normal lowercase">(wt: 5)</span>
                </span>
                <div class="flex items-center gap-1">
                  <button
                    id="shuffleBtn"
                    type="button"
                    title="Shuffle slice order"
                    class="p-1 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition-colors"
                    aria-label="Shuffle options"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                    </svg>
                  </button>
                  <button
                    id="resetBtn"
                    type="button"
                    title="Reset to defaults"
                    class="p-1 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition-colors"
                    aria-label="Reset options to defaults"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                  </button>
                </div>
              </div>
              <ul
                id="optionList"
                class="flex flex-col gap-2 max-h-52 overflow-y-auto pr-1"
                aria-label="Wheel options list"
              ></ul>
            </div>
          </div>
        </details>

        <!-- Big Spin Button -->
        <button
          id="spinBtn"
          class="w-full py-4 px-6 rounded-2xl text-white text-lg sm:text-xl font-black button-gradient shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none flex items-center justify-center gap-3 select-none"
        >
          <svg id="spinIcon" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 flex-shrink-0 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span id="spinBtnText">SPIN THE WHEEL!</span>
        </button>
      </section>

      <!-- Right Panel: The Wheel Canvas & Pointer -->
      <section
        class="w-full lg:flex-1 flex flex-col items-center justify-center relative min-h-[340px] sm:min-h-[420px] p-2"
        aria-label="Spin wheel canvas"
      >
        <div
          class="wheel-container relative w-full max-w-[360px] sm:max-w-[440px] aspect-square flex items-center justify-center mx-auto"
        >
          <!-- Canvas Wheel -->
          <canvas id="wheelCanvas" class="w-full h-full block rounded-full"></canvas>

          <!-- SVG Pointer Pin -->
          <div
            id="pointerWrapper"
            class="pointer-wrapper absolute -top-3 left-1/2 -translate-x-1/2 z-20 pointer-events-none select-none"
          >
            <svg
              class="w-9 h-11 filter drop-shadow-md"
              viewBox="0 0 32 40"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M16 38L5 13C2 7 6.5 2 13 2H19C25.5 2 30 7 27 13L16 38Z"
                fill="url(#pointerRedGrad)"
                stroke="#FFFFFF"
                stroke-width="2"
              />
              <circle cx="16" cy="12" r="4.5" fill="#FFFFFF" />
              <circle cx="16" cy="12" r="2.5" fill="#DC2626" />
              <defs>
                <linearGradient id="pointerRedGrad" x1="16" y1="2" x2="16" y2="38" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#EF4444" />
                  <stop offset="1" stop-color="#B91C1C" />
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
      </section>
    </main>

    <!-- Fullscreen Confetti Particle Canvas -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-[60] w-full h-full"></canvas>

    <!-- Modal Dialog (Winner / Warning Alerts) -->
    <div
      id="resultModal"
      class="modal-backdrop fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none select-none"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div
        id="modalCard"
        class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-sm w-full text-center transform scale-95 transition-all duration-200 border border-slate-100 flex flex-col items-center"
      >
        <!-- Modal Icon Container -->
        <div
          id="modalIcon"
          class="w-16 h-16 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center mb-4 shadow-sm"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 3h14a2 2 0 012 2v2a6 6 0 01-5 5.91V16h2a2 2 0 012 2v2H4v-2a2 2 0 012-2h2v-3.09A6 6 0 013 7V5a2 2 0 012-2zM3 7a4 4 0 004 4m14-4a4 4 0 01-4 4" />
          </svg>
        </div>

        <!-- Modal Title -->
        <h2 class="text-2xl font-extrabold text-slate-900 mb-1" id="modalTitle">
          Congratulations!
        </h2>

        <!-- Result / Message Box -->
        <div id="resultBox" class="w-full my-4">
          <p
            id="resultSubtitle"
            class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-1.5"
          >
            Winning Option
          </p>
          <div
            id="resultHighlight"
            class="bg-indigo-50/70 border border-indigo-100 text-indigo-700 py-3.5 px-4 rounded-2xl break-words"
          >
            <span id="resultText" class="text-xl sm:text-2xl font-black">
              ---
            </span>
          </div>
        </div>

        <!-- Close / Action Button -->
        <button
          id="closeModalBtn"
          class="w-full py-3.5 px-6 rounded-xl text-white font-bold text-base button-gradient shadow-md hover:shadow-lg transition-all transform hover:scale-[1.02] active:scale-100"
        >
          Awesome!
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
